[Event]
EngineExtEvent = event:/cars/ruf_yellowbird/engine_ext
BackfireExtEvent = event:/cars/ruf_yellowbird/backfire_ext
GearExtEvent = event:/cars/ruf_yellowbird/gear_ext

[Parameter]
RPMParameter = rpms
ThrottleParameter = throttle

[Audio]
VolumeLevelEngine = 0.7
VolumeLevelBackfire = 2.0
VolumeLevelGear = 1.0
MinRPM = 1000
MaxRPM = 7500
RPMAcceleration = 120
RPMDeceleration = 100
GearTime = 500  ; 1000ms = 1s